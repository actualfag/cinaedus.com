<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Inscription editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../css/inscription.css">
  <link rel="stylesheet" href="editor.css">
  <script type="module" src="editor.js"></script>
</head>
<body class="ed">
  <div class="ed-stage" id="stage">
    <div class="ed-frame" id="frame">
      <div class="page" id="page">
        <div class="page-inner">
          <main class="inscription" id="inscription"></main>
        </div>
      </div>
    </div>
  </div>
  <aside class="ed-panel" id="panel" aria-label="Editor"></aside>
  <div class="ed-audition" id="audition" hidden></div>
  <div class="ed-toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
